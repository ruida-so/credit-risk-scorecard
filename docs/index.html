<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信用风险评分卡</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: sans-serif;
      font-size: 18px;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="loading">加载中…</div>
  <iframe src="https://credit-risk-scorecard.streamlit.app" onload="document.getElementById('loading').style.display='none'"></iframe>
</body>
</html>
